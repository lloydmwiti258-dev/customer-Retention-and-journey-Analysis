<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Customer Retention & Analytics Platform by Lloyd Mwiti Mugo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141a"/><stop offset="0.55" stop-color="#0b2530"/><stop offset="1" stop-color="#0d3b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.15"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2f3a"/><stop offset="1" stop-color="#0a1f27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect y="0" width="1280" height="6" fill="url(#accent)"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#94a3b8" font-size="17" font-weight="600" letter-spacing="4">DATA ANALYTICS · DATA ENGINEERING · BI</text>
    <text x="72" y="182" fill="#f8fafc" font-size="64" font-weight="800">Customer Retention &amp;</text>
    <text x="72" y="256" fill="url(#accent)" font-size="64" font-weight="800">Analytics Platform</text>
    <rect x="72" y="282" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="328" fill="#cbd5e1" font-size="23">Raw POS sheets → Python ETL → KPI engine → live BI dashboard.</text>
    <text x="72" y="360" fill="#cbd5e1" font-size="23">Retention · Cohorts · CAC / LTV · Recency · Basket analysis</text>
  </g>

  <!-- KPI cards -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(72 400)">
      <rect width="170" height="104" rx="14" fill="url(#card)" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="85" y="54" fill="#f8fafc" font-size="36" font-weight="800">21 · 9</text>
      <text x="85" y="84" fill="#94a3b8" font-size="15" font-weight="600">Outlets · regions</text>
    </g>
    <g transform="translate(258 400)">
      <rect width="170" height="104" rx="14" fill="url(#card)" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="85" y="54" fill="#f8fafc" font-size="36" font-weight="800">6</text>
      <text x="85" y="84" fill="#94a3b8" font-size="15" font-weight="600">Time granularities</text>
    </g>
    <g transform="translate(444 400)">
      <rect width="170" height="104" rx="14" fill="url(#card)" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="85" y="54" fill="#f8fafc" font-size="36" font-weight="800">13</text>
      <text x="85" y="84" fill="#94a3b8" font-size="15" font-weight="600">API endpoints</text>
    </g>
    <g transform="translate(630 400)">
      <rect width="170" height="104" rx="14" fill="url(#card)" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="85" y="54" fill="#f8fafc" font-size="36" font-weight="800">16</text>
      <text x="85" y="84" fill="#94a3b8" font-size="15" font-weight="600">Dashboard charts</text>
    </g>
  </g>

  <!-- dashboard motif -->
  <g transform="translate(872 112)">
    <rect width="336" height="392" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="24" cy="24" r="5" fill="#f87171"/><circle cx="42" cy="24" r="5" fill="#fbbf24"/><circle cx="60" cy="24" r="5" fill="#34d399"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="24" y="76" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="1.5">REPEAT RATE</text>
      <text x="24" y="114" fill="#f8fafc" font-size="34" font-weight="800">Retention</text>
      <text x="24" y="138" fill="#34d399" font-size="14" font-weight="600">▲ New vs returning cohorts</text>
    </g>
    <g transform="translate(262 104)">
      <circle r="36" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>
      <circle r="36" fill="none" stroke="#34d399" stroke-width="12" stroke-dasharray="148 226" transform="rotate(-90)" stroke-linecap="round"/>
      <circle r="36" fill="none" stroke="#22d3ee" stroke-width="12" stroke-dasharray="54 226" stroke-dashoffset="-160" transform="rotate(-90)" stroke-linecap="round"/>
    </g>
    <g transform="translate(28 366)">
      <rect x="0"   y="-70"  width="28" height="70"  rx="5" fill="url(#bar)"/>
      <rect x="42"  y="-104" width="28" height="104" rx="5" fill="url(#bar)"/>
      <rect x="84"  y="-88"  width="28" height="88"  rx="5" fill="url(#bar)"/>
      <rect x="126" y="-134" width="28" height="134" rx="5" fill="url(#bar)"/>
      <rect x="168" y="-120" width="28" height="120" rx="5" fill="url(#bar)"/>
      <rect x="210" y="-160" width="28" height="160" rx="5" fill="url(#bar)"/>
      <rect x="252" y="-150" width="28" height="150" rx="5" fill="url(#bar)"/>
      <polyline points="14,-92 56,-126 98,-110 140,-158 182,-144 224,-184 266,-174" fill="none" stroke="#a3e635" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#06141a" stroke="#a3e635" stroke-width="3"><circle cx="140" cy="-158" r="5"/><circle cx="224" cy="-184" r="5"/><circle cx="266" cy="-174" r="5"/></g>
    </g>
  </g>

  <!-- footer -->
  <line x1="72" y1="552" x2="1208" y2="552" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <circle cx="94" cy="590" r="22" fill="url(#accent)"/>
    <text x="94" y="597" text-anchor="middle" fill="#06141a" font-size="18" font-weight="800">LM</text>
    <text x="130" y="586" fill="#f8fafc" font-size="20" font-weight="700">Lloyd Mwiti Mugo</text>
    <text x="130" y="610" fill="#94a3b8" font-size="15">Data Analyst · Data Engineer · BI Developer</text>
    <text x="1208" y="586" text-anchor="end" fill="#94a3b8" font-size="15" font-weight="600">Python · pandas · Flask · Chart.js · Google Sheets API</text>
    <text x="1208" y="610" text-anchor="end" fill="#64748b" font-size="15">github.com/lloydmwiti258-dev</text>
  </g>
</svg>
