<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Customer Retention and Analytics Platform: from raw POS sheets to retention, CAC and LTV intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141a"/>
      <stop offset="0.55" stop-color="#0b2530"/>
      <stop offset="1" stop-color="#0d3b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>

  <!-- dashboard motif: retention cohort bars + doughnut + trend -->
  <g transform="translate(860 70)">
    <rect x="0" y="0" width="360" height="220" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="20" cy="20" r="4" fill="#f87171"/><circle cx="34" cy="20" r="4" fill="#fbbf24"/><circle cx="48" cy="20" r="4" fill="#34d399"/>
    <text x="340" y="25" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">RETENTION · CAC · LTV</text>

    <!-- doughnut: new vs returning -->
    <g transform="translate(300 92)">
      <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
      <circle r="30" fill="none" stroke="#34d399" stroke-width="10" stroke-dasharray="122 189" transform="rotate(-90)" stroke-linecap="round"/>
      <circle r="30" fill="none" stroke="#22d3ee" stroke-width="10" stroke-dasharray="52 189" stroke-dashoffset="-128" transform="rotate(-90)" stroke-linecap="round"/>
    </g>

    <g transform="translate(26 196)">
      <rect x="0"   y="-58"  width="24" height="58"  rx="4" fill="url(#bar)"/>
      <rect x="36"  y="-84"  width="24" height="84"  rx="4" fill="url(#bar)"/>
      <rect x="72"  y="-70"  width="24" height="70"  rx="4" fill="url(#bar)"/>
      <rect x="108" y="-108" width="24" height="108" rx="4" fill="url(#bar)"/>
      <rect x="144" y="-96"  width="24" height="96"  rx="4" fill="url(#bar)"/>
      <rect x="180" y="-124" width="24" height="124" rx="4" fill="url(#bar)"/>
      <rect x="216" y="-116" width="24" height="116" rx="4" fill="url(#bar)"/>
      <polyline points="12,-76 48,-104 84,-90 120,-128 156,-116 192,-144 228,-136" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#06141a" stroke="#a3e635" stroke-width="2.5">
        <circle cx="120" cy="-128" r="4.5"/><circle cx="192" cy="-144" r="4.5"/><circle cx="228" cy="-136" r="4.5"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="3.5">DATA ANALYTICS · DATA ENGINEERING · BUSINESS INTELLIGENCE</text>
    <text x="64" y="148" fill="#f8fafc" font-size="50" font-weight="800">Customer Retention &amp;</text>
    <text x="64" y="204" fill="url(#accent)" font-size="50" font-weight="800">Analytics Platform</text>
    <rect x="64" y="226" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="264" fill="#cbd5e1" font-size="19">From raw point-of-sale sheets to retention, CAC and LTV</text>
    <text x="64" y="290" fill="#cbd5e1" font-size="19">intelligence for a multi-branch retail business.</text>
    <text x="64" y="328" fill="#64748b" font-size="14" font-weight="600" letter-spacing="1">LLOYD MWITI MUGO · DATA ANALYST &amp; ENGINEER</text>
  </g>
</svg>
